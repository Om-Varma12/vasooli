[project]
name = "vasooli"
version = "0.1.0"
description = "Bounded, multi-channel revenue recovery agent for UPI Autopay / eNACH / B2B receivables"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "groq>=0.5.0",
    "twilio>=8.10.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "razorpay>=1.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
prod = ["anthropic", "requests", "fastapi", "uvicorn", "redis"]

[tool.setuptools.packages.find]
where = ["src"]
